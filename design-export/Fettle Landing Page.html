  <link rel="stylesheet" href="_ds/fettle-design-system-b6c43b1a-44aa-4bec-8db6-081b15530e61/tokens/colors.css">

  <!-- The one monospace utility face — used ONLY for blueprint annotations -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">

  <style>
    :root {
      --font-annot: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Keyboard focus — always the rust ring, generously visible */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--rust);
      outline-offset: 2px;
      border-radius: 4px;
    }

    @keyframes fettleFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }

    /* Responsive: collapse asymmetric grids on small screens */
    @media (max-width: 860px) {
      .fettle-hero-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
      .fettle-index-row { grid-template-columns: 32px 1fr !important; }
      .fettle-index-row > ul { grid-column: 1 / -1; }
      .fettle-nav-links { gap: 16px !important; }
    }
    @media (max-width: 560px) {
      .fettle-shell-pad { padding-left: 20px !important; padding-right: 20px !important; }
      .fettle-nav-links button:not(:last-child) { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { animation: none !important; }
    }
  </style>

  <template id="__bundler_thumbnail">

    </svg>
  </template>
</head>
